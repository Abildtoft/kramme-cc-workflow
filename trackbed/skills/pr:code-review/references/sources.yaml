sources:
  - id: addy-code-review-quality
    url: https://github.com/addyosmani/agent-skills/blob/main/skills/code-review-and-quality/SKILL.md
    title: "Addy Osmani agent-skills - code review and quality"
    rationale: "Review thresholds, severity prefix grammar, dead-code ask-shape conventions, and the reviewer calibration to drop findings the code disproves and to accept an empty result are adapted from this source."
    usage: inspiration
    last_reviewed_at: 2026-11-04
    baseline_commit: "301b02b12bff98e4688e6984af6556802322bbde"
    baseline_hash: "sha256:fe455372ce2d6ff9c2f22507fccfe7474a5f0378a7936981b286922c5a8d8a43"
  - id: addy-git-workflow-versioning
    url: https://github.com/addyosmani/agent-skills/tree/main/skills/git-workflow-and-versioning
    title: "Addy Osmani agent-skills - git workflow and versioning"
    rationale: "The closeout loop's three-block end-of-run summary (changes made, things not touched, potential concerns) follows the change-summary convention in Addy's git workflow skill."
    usage: inspiration
    last_reviewed_at: 2026-11-04
    baseline_commit: "301b02b12bff98e4688e6984af6556802322bbde"
    baseline_hash: "sha256:f1bd1cf32992fc3751c2563e2551add75ca0206048d4dc84dfed60627d1d8bab"
  - id: pocock-code-review
    url: https://raw.githubusercontent.com/mattpocock/skills/main/skills/engineering/code-review/SKILL.md
    title: "Matt Pocock skills - code-review"
    rationale: "The advisory Fowler smell baseline for code/refactor/simplify PR review dimensions, which both workflows pass to their reviewers, and the discovery of coding-standards guides such as CONTRIBUTING.md and CODING_STANDARDS.md are adapted from this source's Standards axis."
    usage: inspiration
    last_reviewed_at: 2026-11-04
    baseline_commit: "4ae2317ddb22b046e26455e4f9c9b3aaaf62212d"
    baseline_hash: "sha256:6a65cc61114f96db07ec41e3920e67c9c5bf70dd6e0901eb9460ebcb2bdc209f"
  - id: compound-ce-code-review
    url: https://github.com/EveryInc/compound-engineering-plugin/tree/main/skills/ce-code-review
    title: "EveryInc compound-engineering-plugin - ce-code-review"
    rationale: "Reviewer taxonomy, evidence-based synthesis (no confidence from same-model agreement, quoted evidence, protected-subject evidence bars, and contradictions settled from the code), action classes, REVIEW.md policy and settled-decision handling, and the passing-while-broken, feature-gate, and reachability review rules are adapted into the trackbed PR review workflow."
    usage: inspiration
    last_reviewed_at: 2026-11-04
    baseline_commit: "a3bcedfc7136d5db2262c8339e514b6fb15b8f81"
    baseline_hash: "sha256:172c3247a7413f2b48caaf7812b3d2eb686d7ebaf84bb76267cbdc0367ec3768"
  - id: ponytail-review
    url: https://github.com/DietrichGebert/ponytail/blob/main/skills/ponytail-review/SKILL.md
    title: "Ponytail - ponytail-review"
    rationale: "The lean review dimension adapts Ponytail's deletion-first over-engineering taxonomy and preference for existing, stdlib, native, or smaller code before new ownership, and the smell baseline's split-by-responsibility, not-by-length guidance follows it."
    usage: inspiration
    last_reviewed_at: 2026-11-04
    baseline_commit: "96608e078b2d5ea607c5c3b8b5a54d1c1fba6846"
    baseline_hash: "sha256:97be9e45d9f6ae8e251a363e08896bfd7ede9c1fa4027a183b40292030be53cb"
  - id: openclaw-autoreview
    url: https://github.com/openclaw/agent-skills/blob/main/skills/autoreview/SKILL.md
    title: "OpenClaw agent-skills - autoreview"
    rationale: "The opt-in closeout loop adapts this source's closeout review contract, advisory-finding discipline, likelihood-and-harm triage, and handling of a failed verifier; its rerun-after-fix loop came from an earlier version of this source."
    usage: inspiration
    last_reviewed_at: 2026-11-04
    baseline_commit: "4de04c55d02f57caea32176005c6a6c9517200da"
    baseline_hash: "sha256:ebc732cd3df231ec5a29fafb798ef27a9178ca3fbc1070ab32684df2c2299f41"
  - id: conductor-review-and-merge
    url: https://www.conductor.build/docs/guides/review-and-merge
    title: "Conductor Docs - Review and merge a workspace"
    rationale: "Conductor's local diff-comment and Checks workflow informs the optional projection of canonical review findings into workspace comments."
    usage: inspiration
    last_reviewed_at: 2026-08-24
    baseline_hash: "sha256:e3f016211467ad38f4543635237878d7f446ed6cc542e2569377449dd17f231b"
  - id: aihero-codebases-ai-agents-love
    url: https://www.aihero.dev/how-to-make-codebases-ai-agents-love
    title: "AI Hero - How To Make Codebases AI Agents Love"
    rationale: "The conditional architecture dimension, which reviews module depth, public-interface changes, internal imports, and locality and lists changed interfaces for the human reviewer, follows this article's case that people own module interfaces while agents work behind them."
    usage: inspiration
    last_reviewed_at: 2026-10-19
    fetch_mode: curl-html
    baseline_hash: "sha256:65468e66b9717bd9c50ef2578ae140ec4953ead1955139499b9303e3e56a1870"
  - id: pocock-improve-codebase-architecture-language
    url: https://raw.githubusercontent.com/mattpocock/skills/main/skills/engineering/codebase-design/SKILL.md
    title: "Matt Pocock skills - codebase-design (SKILL.md)"
    rationale: "The module, interface, depth, seam, and locality vocabulary in the shared architecture glossary passed to the architecture reviewer is adapted from this source."
    usage: inspiration
    last_reviewed_at: 2026-10-19
    baseline_commit: "4ae2317ddb22b046e26455e4f9c9b3aaaf62212d"
    baseline_hash: "sha256:2c20617f87ec8af6a434859f381b2f061a69b530444e74eb39e78bb016a6d1e2"
  - id: pocock-improve-codebase-architecture-deepening
    url: https://raw.githubusercontent.com/mattpocock/skills/main/skills/engineering/codebase-design/DEEPENING.md
    title: "Matt Pocock skills - codebase-design (DEEPENING.md)"
    rationale: "The deletion test and adapter-count rule in the shared architecture glossary that the architecture reviewer applies to new wrappers and seams are adapted from this source."
    usage: inspiration
    last_reviewed_at: 2026-10-19
