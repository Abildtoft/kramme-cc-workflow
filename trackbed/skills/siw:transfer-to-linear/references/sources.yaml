sources:
  - id: linear-project-milestones
    url: https://linear.app/docs/project-milestones
    title: "Linear — Project milestones"
    rationale: "The phase-to-milestone mapping in references/linear-mapping.md (Milestone Mapping) relies on project milestones being first-class objects with name/description/targetDate, distinct from cycles."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    fetch_mode: curl-html
    baseline_hash: "sha256:203a1fa55ab8510a849337261d3d2523910ad1357701d79851d1df65b19e7880"
  - id: linear-mcp
    url: https://linear.app/docs/mcp
    title: "Linear — Model Context Protocol (MCP) server"
    rationale: "The skill targets the official Linear MCP server for project, milestone, document, and issue writes; the Feb 2026 MCP update is why milestone and document creation are assumed available. Phase 1's capability discovery (relation parameters on issue writes, attachment-upload tools) exists because the MCP tool surface keeps growing across releases."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    fetch_mode: curl-html
    baseline_hash: "sha256:538503f22222a2f383d6ae47447fd7f8dd89ff5ee1b48dc51ca3b2c04f6b0aef"
  - id: linear-issue-relations
    url: https://linear.app/docs/issue-relations
    title: "Linear — Issue relations"
    rationale: "Grounds the native-relation pass in references/linear-mapping.md (Dependencies): current MCP issue writes accept append-only blockedBy/blocks/relatedTo parameters, so the skill writes native relations when capability discovery finds them and falls back to text-only dependencies otherwise."
    usage: inspiration
    last_reviewed_at: 2026-07-29
    baseline_hash: "sha256:f0342eca2581109a4f231c25fbc45507054a63dd006971a6a9aaf1b2aef49c67"
  - id: linear-priority
    url: https://linear.app/docs/priority
    title: "Linear — Priority"
    rationale: "The priority mapping table in references/linear-mapping.md maps SIW High/Medium/Low onto Linear's numeric priority scale (0 None, 1 Urgent, 2 High, 3 Medium, 4 Low)."
    usage: inspiration
    last_reviewed_at: 2026-07-29
    baseline_hash: "sha256:3ee0319cd6a9c9b35f9219df00c9f74a7475b83a75cf6c68914ca57dccf1f691"
  - id: linear-graphql-schema
    url: https://raw.githubusercontent.com/linear/linear/master/packages/sdk/src/schema.graphql
    graphql_definitions: [IssueRelationType, ProjectCreateInput, WorkflowState]
    title: "Linear — GraphQL API schema"
    rationale: "Source of the WorkflowState type values (backlog/unstarted/started/completed/canceled) used for status mapping, the ProjectCreateInput contract (teamIds required, statusId is a UUID), and the IssueRelationType enum noted in the Dependencies section."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    fetch_mode: graphql-helper
    baseline_hash: "sha256:80449072663e38b9f468d62f4cb5f93c9de4f7d4f29e40ff02bf497be29d017c"
  - id: linear-rate-limiting
    url: https://linear.app/developers/rate-limiting
    title: "Linear — API rate limiting"
    rationale: "Informs the expectation that one-issue-per-mutation migration is acceptable for typical SIW sizes and that the MCP server offers no batching primitive."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    fetch_mode: curl-html
    baseline_hash: "sha256:9355d0895afb9075261ef190914251b9a492702ebf7c3e8848e9d1526abd92bf"
