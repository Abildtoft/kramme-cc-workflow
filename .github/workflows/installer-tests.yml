name: Codex Installer Tests

on:
  pull_request:

jobs:
  install:
    name: Validate installers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Codex CLI
        # Pinned to the release the plugin cache layout was verified against.
        run: npm install -g @openai/codex@0.154.0 --no-audit --no-fund

      - name: Validate build output
        run: |
          set -euo pipefail

          plugin=kramme-cc-workflow
          OUT_DIR="$RUNNER_TEMP/${plugin}-marketplace"
          rm -rf "$OUT_DIR"

          node ./kramme-cc-workflow/scripts/convert-plugin.js build "$plugin" --out "$OUT_DIR"
          eval "$(node ./kramme-cc-workflow/scripts/convert-plugin.js stats "$plugin" | sed 's/^/EXPECTED_/')"

          PLUGIN_ROOT="$OUT_DIR/plugins/$plugin"
          test -f "$OUT_DIR/.agents/plugins/marketplace.json"
          test -f "$PLUGIN_ROOT/.codex-plugin/plugin.json"
          test -f "$PLUGIN_ROOT/hooks/hooks.json"
          test -x "$PLUGIN_ROOT/scripts/collect-review-diff.sh"

          SKILLS=$(find "$PLUGIN_ROOT/skills" -name SKILL.md | wc -l | tr -d '[:space:]')
          echo "Expected skills: $((EXPECTED_codex_skills + EXPECTED_agent_skills))"
          echo "Built skills: $SKILLS"
          test "$SKILLS" -eq $((EXPECTED_codex_skills + EXPECTED_agent_skills))

          if grep -rl '\${CLAUDE_PLUGIN_ROOT' "$PLUGIN_ROOT/skills" --include='*.md'; then
            echo "Converted skills still reference CLAUDE_PLUGIN_ROOT" >&2
            exit 1
          fi

      - name: Install through the Codex CLI
        run: |
          set -euo pipefail

          plugin=kramme-cc-workflow
          WORK_DIR="$RUNNER_TEMP/${plugin}-codex"
          CODEX_HOME="$WORK_DIR/.codex"
          AGENTS_HOME="$WORK_DIR/.agents"
          rm -rf "$WORK_DIR"
          mkdir -p "$CODEX_HOME" "$AGENTS_HOME"

          ./$plugin/scripts/install-codex.sh \
            --non-interactive \
            --codex-home "$CODEX_HOME" \
            --agents-home "$AGENTS_HOME"

          VERSION=$(node -e "console.log(require('./kramme-cc-workflow/.claude-plugin/plugin.json').version)")
          CACHE_ROOT="$CODEX_HOME/plugins/cache/$plugin/$plugin/$VERSION"
          test -f "$CACHE_ROOT/.codex-plugin/plugin.json"
          test -f "$CACHE_ROOT/skills/kramme:pr:create/SKILL.md"
          test -f "$CACHE_ROOT/hooks/hooks.json"
          test ! -e "$CODEX_HOME/skills"
          test ! -e "$CODEX_HOME/AGENTS.md"

          echo "--- codex plugin list ---"
          CODEX_HOME="$CODEX_HOME" codex plugin list
          CODEX_HOME="$CODEX_HOME" codex plugin list | grep -E "^${plugin}@${plugin} +installed, enabled +${VERSION}"

          echo "--- Codex config ---"
          cat "$CODEX_HOME/config.toml"
