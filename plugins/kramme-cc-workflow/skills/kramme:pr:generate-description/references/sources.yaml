    title: "GOV.UK content and publishing guidance - Identify user needs"
    rationale: "Its user-needs guidance informs the readability pass's fixed reader contract: what a reviewer needs to understand, decide, or do."
    usage: inspiration
    last_reviewed_at: 2026-08-16
    baseline_hash: "sha256:4030bacb2fd97c21f27d3b641c19d8f4973cd0bf2c6a1f15021ba1eead34d939"
