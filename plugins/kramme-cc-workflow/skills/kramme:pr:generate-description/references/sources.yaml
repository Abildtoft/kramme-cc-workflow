    title: "Addy Osmani agent-skills - git workflow and versioning"
    rationale: "Output markers, pull-request handoff conventions, and stating deliberate scope boundaries as reviewer notes are adapted from this source. The PR handoff discipline, structured change-summary expectations, and output-marker style that shape check mode's drift report come from the same source; they were reviewed against upstream commit 5e262b20e0cd88dba39e558f42f5c0b6d766d4b4 when check mode was a separate verifier skill."
