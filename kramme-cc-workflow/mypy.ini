[mypy]
python_version = 3.11
show_error_codes = True
strict = True
warn_unreachable = True

# Ratchet owner: repository maintainers.
# These sections keep all production modules under strict checking while the
# named legacy diagnostics are paid down. Remove codes individually as fixed.

# An optional release tag currently needs narrowing.
[mypy-changelog]
disable_error_code = assignment

# Subprocess command assembly and optional CLI values need narrower types.
[mypy-release]
disable_error_code = arg-type, list-item, no-any-return

# The existing path normalization reuses a variable across Path and str values.
[mypy-lint_skill_contracts.checks.basic]
disable_error_code = assignment

# The compatibility wrapper still needs parameter annotations.
[mypy-lint_skill_contracts.checks.registry]
disable_error_code = no-untyped-def

# Two parsing branches intentionally reuse the same local helper name.
[mypy-lint_skill_contracts.frontmatter]
disable_error_code = no-redef

# README rendering still has callback and optional-value annotation gaps.
[mypy-lint_skill_contracts.readme]
disable_error_code = arg-type, no-any-return, no-untyped-def

# Schema loading returns decoded JSON and retains a defensive fallback branch.
[mypy-lint_skill_contracts.schema]
disable_error_code = no-any-return, unreachable

# The tool-status dictionary and generated manifest need explicit local types.
[mypy-demo_reel_helper]
disable_error_code = assignment, var-annotated

# Optional Google/Pillow imports are runtime-deferred; the CLI entry point still
# needs an explicit return type before its untyped-call exceptions can be removed.
[mypy-generate_image]
disable_error_code = import-not-found, no-untyped-call, no-untyped-def
