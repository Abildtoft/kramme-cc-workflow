  - id: claude-marketplace-settings
    url: https://code.claude.com/docs/en/settings-reference.md
    title: "Claude Code settings reference"
    rationale: "Defines whole-entry marketplace replacement and the additionalMarketplaces alias; the checker preserves the registry fallback when a winning entry omits autoUpdate."
    usage: inspiration
    last_reviewed_at: 2026-10-28
    baseline_hash: "sha256:3e61bb59ba30495277af107905960770c81dca87a15fff7bdd04844a63e9d759"
  - id: claude-managed-settings
    url: https://code.claude.com/docs/en/managed-settings.md
    title: "Claude Code managed settings guide"
    rationale: "Defines platform-specific managed settings paths and drop-in fragments; the checker reads the base file and reports unknown for fragment merging or policy outside the files it can inspect."
