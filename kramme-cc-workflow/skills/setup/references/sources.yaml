  - id: claude-settings
    url: https://code.claude.com/docs/en/settings.md
    title: "Claude Code settings guide"
    rationale: "Defines settings locations, precedence, and main-checkout local-file rules; the checker separates session-directory shared settings from local overrides and qualifies the result because session settings and trust are not visible to it."
    usage: inspiration
    last_reviewed_at: 2026-10-28
