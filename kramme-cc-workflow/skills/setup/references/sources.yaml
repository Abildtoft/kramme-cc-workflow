  - id: claude-plugin-loading
    url: https://code.claude.com/docs/en/plugins/loading.md
    title: "Claude Code plugin loading reference"
    rationale: "Documents the plugin-root override, installation records by scope, and precedence of settings-file autoUpdate over the per-marketplace record; the checker resolves local policy without inferring the active session."
    usage: inspiration
