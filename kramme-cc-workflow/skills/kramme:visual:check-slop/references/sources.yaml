    upstream_path: "dist/back.js; dist/index.js; dist/matcher.js; dist/nodes/comment.js; dist/nodes/html.js; dist/nodes/node.js; dist/nodes/text.js; dist/nodes/type.js; dist/parse.js; dist/valid.js; dist/void-tag.js from the node-html-parser npm package"
