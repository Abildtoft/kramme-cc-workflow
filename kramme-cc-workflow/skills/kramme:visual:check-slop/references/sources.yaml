  - id: gesso-anti-slop
    url: https://github.com/Gesso-Build/skills
    title: "Gesso Build anti-slop skill and detector"
    rationale: "The local skill, TypeScript detector, 73-rule registry, rule catalog, and retained tests are copied and adapted from the upstream anti-slop project."
    usage: copied
    license: MIT
    notice: references/THIRD_PARTY_NOTICES.md
    upstream_path: "skills/anti-slop/SKILL.md; skills/anti-slop/references/rules.md; src/cli.ts; src/engine.ts; src/index.ts; src/rules.ts; src/types.ts; src/__tests__/*.test.ts except install-and-plugin.test.ts"
