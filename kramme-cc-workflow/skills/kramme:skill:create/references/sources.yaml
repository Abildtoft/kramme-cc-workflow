    title: "Matt Pocock skills - write-a-skill"
    rationale: "The description-as-system-prompt-real-estate framing in Phase 4 (the description is the only thing the agent sees when picking a skill to load), the no-time-sensitive-info validation rule, and the references-one-level-deep validation rule are adapted from this source."
    usage: inspiration
    last_reviewed_at: 2026-07-29
