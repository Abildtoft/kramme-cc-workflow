  - id: posthog-writing-agent-skills
    url: https://newsletter.posthog.com/p/what-nobody-tells-you-about-writing
    title: "PostHog - What nobody tells you about writing agent skills"
    rationale: "The outcome-contract authoring default in the writing guidelines and both templates (be precise about goal, constraints, non-derivable context, and success evidence while leaving procedure loose), plus the progressive-disclosure and description-size discipline that keeps skill selection accurate, are adapted from this source."
